---

- hosts: prod
  become: true
  vars:
    system_user: admin
  vars_files:
    - files/secrets/credentials.yml
  pre_tasks:
    - name: create www-data
      user: name=www-data state=present
    - name: Clean Docker before deployment
      shell: |
        docker system prune -a -f --volumes
      ignore_errors: yes
  roles:
    - { role: ansible-role-containerized-wordpress }
